name: "🌐 Deploy Web Platform to GitHub Pages"

on:
  # Solo ejecución manual (en repositorios privados GitHub Pages requiere GitHub Pro/Enterprise)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build platform
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dgbemibfisneieiiexzg.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYmVtaWJmaXNuZWllaWlleHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDI5OTgsImV4cCI6MjEwMzI3ODk5OH0.eSyZ2kf8Sla4GeUt6w55o8kqeHrwCdMNUqh0Wy7DE8o' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
